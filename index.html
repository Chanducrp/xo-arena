<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0B1020"><title>XO Arena</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#243b55,#0b1020 65%);color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}.app{width:min(430px,100%);text-align:center}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.sub{opacity:.6;margin:4px 0 18px}.score{display:flex;gap:10px;margin-bottom:16px}.score div{flex:1;background:#fff1;border:1px solid #fff2;border-radius:16px;padding:10px}.score b{display:block;font-size:24px}.score span{font-size:10px;opacity:.6}.status{background:#fff1;border:1px solid #fff2;border-radius:15px;padding:13px;margin-bottom:14px;font-weight:800}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1;background:#fff0;padding:10px;border-radius:24px}.cell{border:0;border-radius:18px;background:#eef3f9;color:#101827;font-size:clamp(54px,17vw,78px);font-weight:900;cursor:pointer;box-shadow:inset 0 -5px 0 #ccd5df;transition:.12s;touch-action:manipulation}.cell:active{transform:scale(.95)}.cell.x{color:#1677ff}.cell.o{color:#e63c65}.cell.win{background:#bfffcf;box-shadow:0 0 20px #55ef8b}.controls{display:flex;gap:10px;margin-top:16px}.controls button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:800;cursor:pointer}#new{background:#20d58a;color:#07130d}.mode{background:#fff1;color:#fff;border:1px solid #fff2!important}.toast{height:22px;margin-top:8px;color:#72f0b0;font-weight:700;font-size:13px}.panel{font-size:11px;opacity:.45}button:focus-visible{outline:3px solid #72f0b0;outline-offset:2px}</style></head><body><main class="app"><div class="brand">X • O ARENA</div><div class="sub">CLASSIC TIC-TAC-TOE</div><div class="score"><div><b id="sx">0</b><span>PLAYER X</span></div><div><b id="draw">0</b><span>DRAWS</span></div><div><b id="so">0</b><span>PLAYER O</span></div></div><div class="status" id="status">Player X's turn</div><div class="board" id="board"></div><div class="controls"><button id="new">NEW ROUND</button><button class="mode" id="mode">MODE: 2 PLAYER</button></div><div class="toast" id="toast"></div><div class="panel">Tap a square • First to make 3 in a row wins</div></main><script>const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),sx=document.getElementById('sx'),so=document.getElementById('so'),draw=document.getElementById('draw'),modeBtn=document.getElementById('mode'),toast=document.getElementById('toast');let cells=[],turn='X',over=false,ai=false,scores={X:0,O:0,D:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){boardEl.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell '+(v?v.toLowerCase():'');b.textContent=v;b.setAttribute('aria-label',v?`Cell ${i+1}: ${v}`:`Cell ${i+1}`);b.onclick=()=>play(i);boardEl.appendChild(b)})}function check(){for(const w of wins)if(cells[w[0]]&&cells[w[0]]===cells[w[1]]&&cells[w[1]]===cells[w[2]])return w;return null}function finish(w,line){over=true;if(w){scores[w]++;statusEl.textContent=`Player ${w} wins! 🎉`;line.forEach(i=>boardEl.children[i].classList.add('win'));toast.textContent=`${w} takes the round!`}else{scores.D++;statusEl.textContent='Draw! 🤝';toast.textContent='No winner this round.'}update()}function play(i){if(over||cells[i]||(ai&&turn==='O'))return;cells[i]=turn;render();let line=check();if(line)return finish(turn,line);if(cells.every(Boolean))return finish(null,[]);turn=turn==='X'?'O':'X';statusEl.textContent=`Player ${turn}'s turn`;if(ai&&turn==='O')setTimeout(aiMove,280)}function aiMove(){if(over)return;const empty=cells.map((v,i)=>v?null:i).filter(i=>i!==null);for(const i of empty){cells[i]='O';if(check()){render();return finish('O',check())}cells[i]=null}for(const i of empty){cells[i]='X';if(check()){cells[i]='O';render();turn='X';statusEl.textContent="Player X's turn";return}cells[i]=null}const pick=empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)];cells[pick]='O';render();let line=check();if(line)return finish('O',line);if(cells.every(Boolean))return finish(null,[]);turn='X';statusEl.textContent="Player X's turn"}function update(){sx.textContent=scores.X;so.textContent=scores.O;draw.textContent=scores.D}function newRound(){cells=Array(9).fill('');turn='X';over=false;toast.textContent='';statusEl.textContent="Player X's turn";render()}modeBtn.onclick=()=>{ai=!ai;modeBtn.textContent=ai?'MODE: VS AI':'MODE: 2 PLAYER';newRound()};document.getElementById('new').onclick=newRound;newRound();</script></body></html>

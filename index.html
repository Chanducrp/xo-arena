<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B1020">
<title>XO Arena — Online</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#243b55,#0b1020 65%);color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}.app{width:min(430px,100%);text-align:center}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.sub{opacity:.6;margin:4px 0 18px}.score{display:flex;gap:10px;margin-bottom:16px}.score div{flex:1;background:#fff1;border:1px solid #fff2;border-radius:16px;padding:10px}.score b{display:block;font-size:24px}.score span{font-size:10px;opacity:.6}.status{background:#fff1;border:1px solid #fff2;border-radius:15px;padding:13px;margin-bottom:14px;font-weight:800}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1;padding:10px;border-radius:24px}.cell{border:0;border-radius:18px;background:#eef3f9;color:#101827;font-size:clamp(54px,17vw,78px);font-weight:900;cursor:pointer;box-shadow:inset 0 -5px 0 #ccd5df;transition:.12s;touch-action:manipulation}.cell:active{transform:scale(.95)}.cell.x{color:#1677ff}.cell.o{color:#e63c65}.cell.win{background:#bfffcf;box-shadow:0 0 20px #55ef8b}.controls{display:flex;gap:10px;margin-top:16px}.controls button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:800;cursor:pointer}.primary{background:#20d58a;color:#07130d}.mode{background:#fff1;color:#fff;border:1px solid #fff2!important}.onlinePanel{margin-top:14px;padding:14px;background:#fff1;border:1px solid #fff2;border-radius:16px}.onlinePanel h3{margin:0 0 10px;font-size:15px}.roomRow{display:flex;gap:8px}.roomRow input{min-width:0;flex:1;border:0;border-radius:12px;padding:12px;font-size:16px;text-align:center;text-transform:uppercase}.roomRow button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.join{background:#fff;color:#111}.copy{background:#20d58a;color:#07130d;margin-top:8px;width:100%}.toast{min-height:22px;margin-top:8px;color:#72f0b0;font-weight:700;font-size:13px}.panel{font-size:11px;opacity:.45;margin-top:6px}button:focus-visible,input:focus-visible{outline:3px solid #72f0b0;outline-offset:2px}.hidden{display:none}.small{font-size:11px;opacity:.65;margin-top:7px}.onlineBadge{display:inline-block;font-size:10px;padding:3px 7px;border-radius:99px;background:#20d58a;color:#07130d;margin-left:5px;vertical-align:middle}
</style>
</head>
<body>
<main class="app">
<div class="brand">X • O ARENA</div>
<div class="sub">CLASSIC TIC-TAC-TOE <span id="badge" class="onlineBadge hidden">ONLINE</span></div>
<div class="score"><div><b id="sx">0</b><span>PLAYER X</span></div><div><b id="draw">0</b><span>DRAWS</span></div><div><b id="so">0</b><span>PLAYER O</span></div></div>
<div class="status" id="status">Player X's turn</div>
<div class="board" id="board"></div>
<div class="controls"><button class="primary" id="new">NEW ROUND</button><button class="mode" id="mode">MODE: 2 PLAYER</button></div>
<div class="onlinePanel">
<h3>🌐 Play Online</h3>
<div class="roomRow"><input id="room" maxlength="8" placeholder="ROOM CODE"><button class="join" id="join">JOIN</button></div>
<button class="copy hidden" id="copy">COPY ROOM CODE</button>
<div class="small" id="onlineInfo">Create a room by entering any 4–8 character code.</div>
</div>
<div class="toast" id="toast"></div>
<div class="panel">Tap a square • First to make 3 in a row wins</div>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),sx=document.getElementById('sx'),so=document.getElementById('so'),draw=document.getElementById('draw'),modeBtn=document.getElementById('mode'),toast=document.getElementById('toast'),roomInput=document.getElementById('room'),joinBtn=document.getElementById('join'),copyBtn=document.getElementById('copy'),onlineInfo=document.getElementById('onlineInfo'),badge=document.getElementById('badge');
let cells=[],turn='X',over=false,ai=false,scores={X:0,O:0,D:0},online=false,peer=null,conn=null,myMark=null,roomCode='';
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function render(){boardEl.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell '+(v?v.toLowerCase():'');b.textContent=v;b.setAttribute('aria-label',v?`Cell ${i+1}: ${v}`:`Cell ${i+1}`);b.onclick=()=>play(i);boardEl.appendChild(b)})}
function check(){for(const w of wins)if(cells[w[0]]&&cells[w[0]]===cells[w[1]]&&cells[w[1]]===cells[w[2]])return w;return null}
function finish(w,line){over=true;if(w){scores[w]++;statusEl.textContent=`Player ${w} wins! 🎉`;line.forEach(i=>boardEl.children[i].classList.add('win'));toast.textContent=`${w} takes the round!`}else{scores.D++;statusEl.textContent='Draw! 🤝';toast.textContent='No winner this round.'}update();send({type:'result',winner:w||null,line:line||[]})}
function localFinish(w,line){over=true;if(w){scores[w]++;statusEl.textContent=`Player ${w} wins! 🎉`;line.forEach(i=>boardEl.children[i].classList.add('win'));toast.textContent=`${w} takes the round!`}else{scores.D++;statusEl.textContent='Draw! 🤝';toast.textContent='No winner this round.'}update()}
function play(i){if(over||cells[i]||(online&&turn!==myMark)||(ai&&turn==='O'))return;cells[i]=turn;render();let line=check();if(line){if(online){localFinish(turn,line);send({type:'state',cells,turn,over:true,winner:turn,line});}else finish(turn,line);return}if(cells.every(Boolean)){if(online){localFinish(null,[]);send({type:'state',cells,turn,over:true,winner:null,line:[]});}else finish(null,[]);return}turn=turn==='X'?'O':'X';statusEl.textContent=online?`Player ${turn}'s turn`:`Player ${turn}'s turn`;if(online)send({type:'state',cells,turn,over:false});if(ai&&turn==='O')setTimeout(aiMove,280)}
function aiMove(){if(over)return;const empty=cells.map((v,i)=>v?null:i).filter(i=>i!==null);for(const i of empty){cells[i]='O';if(check()){render();return finish('O',check())}cells[i]=null}for(const i of empty){cells[i]='X';if(check()){cells[i]='O';render();turn='X';statusEl.textContent="Player X's turn";return}cells[i]=null}const pick=empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)];cells[pick]='O';render();let line=check();if(line)return finish('O',line);if(cells.every(Boolean))return finish(null,[]);turn='X';statusEl.textContent="Player X's turn"}
function update(){sx.textContent=scores.X;so.textContent=scores.O;draw.textContent=scores.D}
function newRound(sendRemote=true){cells=Array(9).fill('');turn='X';over=false;toast.textContent='';statusEl.textContent=online?`Player X's turn`:`Player X's turn`;render();if(online&&sendRemote)send({type:'state',cells,turn,over:false,winner:null,line:[]})}
modeBtn.onclick=()=>{if(online){toast.textContent='Leave online room before changing mode.';return}ai=!ai;modeBtn.textContent=ai?'MODE: VS AI':'MODE: 2 PLAYER';newRound()};document.getElementById('new').onclick=()=>newRound(true);
function send(data){if(conn&&conn.open)conn.send(data)}
function makePeer(id){peer=new Peer(id,{debug:0});peer.on('open',()=>{onlineInfo.textContent=`Room ${roomCode} ready. Share the code with your friend.`;copyBtn.classList.remove('hidden');toast.textContent='Waiting for Player O…'});peer.on('connection',c=>{if(conn&&conn.open){c.close();return}conn=c;myMark='X';setupConn();});peer.on('error',e=>{toast.textContent=e.type==='unavailable-id'?'Room already exists — tap JOIN to enter it.':'Connection error. Try another room code.'});}
function setupConn(){conn.on('open',()=>{badge.classList.remove('hidden');online=true;modeBtn.textContent='MODE: ONLINE';joinBtn.textContent='CONNECTED';roomInput.disabled=true;joinBtn.disabled=true;onlineInfo.textContent=`You are Player ${myMark}.`;toast.textContent='Opponent connected!';newRound(false);send({type:'hello',mark:myMark});});conn.on('data',data=>handleData(data));conn.on('close',()=>{toast.textContent='Opponent disconnected.';statusEl.textContent='Connection closed';online=false;});conn.on('error',()=>toast.textContent='Connection lost.');}
function handleData(data){if(data.type==='hello'){if(!myMark)myMark='O';online=true;badge.classList.remove('hidden');newRound(false);toast.textContent='Connected! You are Player O.';return}if(data.type==='state'){cells=data.cells;turn=data.turn;over=data.over;render();statusEl.textContent=over?(data.winner?`Player ${data.winner} wins! 🎉`:'Draw! 🤝'):`Player ${turn}'s turn`;if(data.line)data.line.forEach(i=>boardEl.children[i]?.classList.add('win'));return}if(data.type==='reset'){scores=data.scores||scores;newRound(false);update()}}
function createRoom(){const code=roomInput.value.trim().toUpperCase();if(code.length<4||code.length>8){toast.textContent='Enter a 4–8 character room code.';return}roomCode=code;ai=false;modeBtn.textContent='MODE: ONLINE';makePeer('xo-arena-'+code);toast.textContent='Creating room…'}
function joinRoom(){const code=roomInput.value.trim().toUpperCase();if(code.length<4||code.length>8){toast.textContent='Enter a 4–8 character room code.';return}roomCode=code;peer=new Peer(undefined,{debug:0});peer.on('open',()=>{conn=peer.connect('xo-arena-'+code,{reliable:true});myMark='O';setupConn();toast.textContent='Joining room…'});peer.on('error',e=>toast.textContent='Could not join room. Check the code.');}
joinBtn.onclick=()=>{if(online)return;const code=roomInput.value.trim();if(code.length<4){toast.textContent='Enter a room code first.';return}createRoom();setTimeout(()=>{if(peer&&peer.destroyed)return},500)};
joinBtn.addEventListener('dblclick',()=>joinRoom());
roomInput.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});
copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(roomCode);toast.textContent=`Room code ${roomCode} copied!`}catch(e){toast.textContent=`Room code: ${roomCode}`}};
// First click creates the room; Enter key joins an existing room. A small hint lets players choose.
roomInput.addEventListener('input',()=>{onlineInfo.textContent='Enter a new code and tap JOIN to create it; press Enter to join an existing room.'});
newRound(false);
</script>
</body>
</html>
